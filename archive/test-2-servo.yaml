# ─── OUTPUTS PWM pentru servomotoare ───────────────────────────────────────────
output:
  - platform: ledc
    id: servo_x_pwm
    pin: GPIO4          # Servo 1 (axa X a joystick-ului)
    frequency: 50Hz

  - platform: ledc
    id: servo_y_pwm
    pin: GPIO5          # Servo 2 (axa Y a joystick-ului)
    frequency: 50Hz

# ─── SERVOMOTOARE SG90 ─────────────────────────────────────────────────────────
servo:
  - id: servo_x
    output: servo_x_pwm
    min_level: 2.5%     # ~0.5ms = 0°
    idle_level: 7.5%    # ~1.5ms = 90° (centru)
    max_level: 12.5%    # ~2.5ms = 180°
    auto_detach_time: 0s

  - id: servo_y
    output: servo_y_pwm
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%
    auto_detach_time: 0s

# ─── SENZORI ADC pentru joystick KY-023 ────────────────────────────────────────
sensor:
  - platform: adc
    id: joystick_x
    pin: GPIO0           # VRx al joystick-ului → GPIO0 (ADC pe C3)
    name: "Joystick X"
    update_interval: 50ms
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 5
      - delta: 0.01       # Ignoră schimbări mici (reducere zgomot)
    on_value:
      then:
        - servo.write:
            id: servo_x
            level: !lambda |-
              // ADC: 0.0 (stânga) → 1.0 (dreapta), centru ~0.5
              // Servo: -1.0 → +1.0
              return (x * 2.0f) - 1.0f;

  - platform: adc
    id: joystick_y
    pin: GPIO1           # VRy al joystick-ului → GPIO1 (ADC pe C3)
    name: "Joystick Y"
    update_interval: 50ms
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 5
      - delta: 0.01
    on_value:
      then:
        - servo.write:
            id: servo_y
            level: !lambda |-
              return (x * 2.0f) - 1.0f;

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic

# ─── BUTONUL joystick-ului (SW) ────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO6      # SW al joystick-ului
      mode: INPUT_PULLUP
      inverted: true
    name: "Joystick Button"
    on_press:
      then:
        # Apăsarea butonului centrează ambele servomotoare
        - servo.write:
            id: servo_x
            level: 0%
        - servo.write:
            id: servo_y
            level: 0%

# ─── CONTROL MANUAL din Home Assistant (opțional) ──────────────────────────────
number:
  - platform: template
    name: "Servo X Manual"
    min_value: -100
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    set_action:
      - servo.write:
          id: servo_x
          level: !lambda "return x / 100.0;"

  - platform: template
    name: "Servo Y Manual"
    min_value: -100
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    set_action:
      - servo.write:
          id: servo_y
          level: !lambda "return x / 100.0;"