# DEPENDS ON: audio/microphone.yaml (va_mic), audio/speaker.yaml (va_speaker), voice/wake_word.yaml (micro_wake_word.start)
# EXPOSES: (nothing named — HA Assist voice satellite, auto-registered via api: + voice_assistant:)

voice_assistant:
  id: va
  microphone: va_mic
  speaker: va_speaker
  noise_suppression_level: 0
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_start:
    - logger.log: "VA started - listening"
  on_end:
    - delay: 1s
    - micro_wake_word.start:
  on_error:
    - lambda: |-
        if (code.size()) {
          ESP_LOGD("va", "VA error: %s", code.c_str());
        } else {
          ESP_LOGD("va", "VA error: <empty>");
        }
    - delay: 10s
    - micro_wake_word.start:
