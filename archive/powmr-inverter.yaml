#
# PASSIVE SNIFFER — HF-LPT270 dongle internal UART tap
#
# ─── SIGNAL CHAIN ──────────────────────────────────────────────────────────────
#
#   Inverter  ←→  SIT3232E (RS-232 level shift)  ←→  HF-LPT270 (Wi-Fi MCU)
#                                                       │          │
#                                                  UART0_TX    UART0_RX
#                                                  (pin 5)      (pin 6)
#                                                  GPIO16        GPIO7
#                                                       │          │
#                                                  ESP32 RX    ESP32 RX2
#                                                  GPIO17       GPIO16
#
# Both signals are 3.3V TTL — safe to connect directly to ESP32 GPIO.
# DO NOT connect any ESP32 TX pin back to the dongle.
#
# ─── WHAT YOU SEE ──────────────────────────────────────────────────────────────
#  [sniff_cmd] CMD >>>  — bytes the HF-LPT270 sends TO the inverter (Modbus requests)
#  [sniff_rsp] RSP <<<  — bytes the inverter sends BACK (Modbus responses)
# ───────────────────────────────────────────────────────────────────────────────

