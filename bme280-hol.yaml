esphome:
  name: bme280-hol

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"


wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou  
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou







i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 200kHz

sensor:
  
  - platform: bme280_i2c
    temperature:
      name: "Temp. Hol"
      oversampling: 16x
      filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 22 -> 20
    pressure:
      name: "Pres. Hol"
    humidity:
      name: "Umid. Hol"
    address: 0x76
    update_interval: 5min



output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: rtttl_out

rtttl:
  output: rtttl_out
  on_finished_playback:
    - logger.log: 'Song ended!'







