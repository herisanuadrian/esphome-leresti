# DEPENDS ON: hardware/i2s_bus.yaml (i2s_spk)
# EXPOSES: speaker.va_speaker (id, consumed by voice/assistant.yaml and audio/media_player.yaml)

speaker:
  - platform: i2s_audio
    id: va_speaker
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO7    # MAX98357A DIN
    dac_type: external
    i2s_mode: primary
    buffer_duration: 300ms
