# DEPENDS ON: hardware/i2s_bus.yaml (i2s_mic)
# EXPOSES: microphone.va_mic (id, consumed by voice/wake_word.yaml and voice/assistant.yaml)

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO6     # INMP441 SD
    adc_type: external
    pdm: false
    channel: left
