# Celula solara 53x30mm intre A0 (pozitiv) si GND (negativ), cu rezistor de
# sarcina 100 ohm in paralel pe celula. A0 citeste tensiunea peste rezistor.
sensor:
  - platform: adc
    pin: A0
    id: productie_solara
    name: "Productie solara"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  - platform: template
    name: "Iradiere solara"
    unit_of_measurement: "W/m²"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float v = id(productie_solara).state;
      float putere_w = (v * v) / 100.0;      // P = V^2 / R, R=100 ohm
      return putere_w / 0.00159;              // / arie celulei (0.053 x 0.03 m)
