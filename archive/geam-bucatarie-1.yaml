
esphome:
  name: geam-bucatarie
  on_boot:
    priority: -100
    then:
      - globals.set:
          id: boot_done
          value: 'true'

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "b108ebea21a5671e665c0bcf35350437"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou
  min_auth_mode: WPA2
  ap:
    ssid: "Geam-Bucatarie AP"
    password: !secret wifi_password_nou

captive_portal:

globals:
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: 'false'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      inverted: False
    name: "Button"
    id: button_input
    filters:
      - delayed_on: 7s
      - delayed_off: 2s
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(boot_done);'
            then:
              - if:
                  condition:
                    binary_sensor.is_on: button_input
                  then:
                    - switch.turn_off: close_switch
                    - switch.turn_on: open_switch
                    - delay: 10s
                    - switch.turn_off: open_switch
                  else:
                    - switch.turn_off: open_switch
                    - switch.turn_on: close_switch
                    - delay: 10s
                    - switch.turn_off: close_switch

switch:
  - platform: gpio
    pin: GPIO12
    name: "Garage Door Open Switch"
    id: open_switch
    restore_mode: ALWAYS_OFF
    interlock: [close_switch]
    interlock_wait_time: 200ms

  - platform: gpio
    pin: GPIO13
    name: "Garage Door Close Switch"
    id: close_switch
    restore_mode: ALWAYS_OFF
    interlock: [open_switch]
    interlock_wait_time: 200ms