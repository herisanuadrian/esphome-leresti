# ─── I2C (BME280 + BH1750) ───────────────────────────────────────────────────
i2c:
  sda: D2    # GPIO4
  scl: D1    # GPIO5
  scan: true
 
# ─── Senzori ─────────────────────────────────────────────────────────────────
sensor:
 
  # --- Viteza vant (anemometru cu impulsuri Hall) ----------------------------
  - platform: pulse_meter
    pin:
      number: D5      # GPIO14
      mode: INPUT_PULLUP
    name: " Viteza Vantului"
    id: viteza_vant
    icon: "mdi:weather-windy"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    filters:
      - multiply: 0.04    # pulsuri/min → km/h  (2.4/60 = 0.04)
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6
      - delta: 0.1
    total:
      name: " Rotatii Total"
      id: rotatii_total
      entity_category: diagnostic
      icon: "mdi:counter"
 
  # --- Rafala vant (maxim in fereastra de 60s) --------------------------------
  - platform: template
    name: " Rafala Vant"
    id: rafala_vant
    icon: "mdi:weather-tornado"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    lambda: |-
      return id(viteza_vant).state;
    update_interval: 1s
    filters:
      - max:
          window_size: 60
          send_every: 60
 
  # --- Directie vant (P3022-V1-CW360 analogic pe A0) ------------------------
  - platform: adc
    pin: A0
    name: " Directie Vant"
    id: directie_vant
    unit_of_measurement: "°"
    icon: "mdi:compass-rose"
    device_class: ""
    update_interval: 2s
    filters:
      - multiply: 360.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - delta: 1.0
    accuracy_decimals: 1
 
  # --- BME280 : Temperatura / Umiditate / Presiune ---------------------------
  - platform: bme280_i2c
    address: 0x76   # sau 0x77 dacă SDO=VCC
    update_interval: 30s
 
    temperature:
      name: " Temperatură"
      id: bme_temp
      filters:
        - offset: 0.0   # calibrare dacă e nevoie
      accuracy_decimals: 1
 
    pressure:
      name: " Presiune"
      id: bme_pres
      unit_of_measurement: "hPa"
      accuracy_decimals: 1
    humidity:
      name: "Umiditate"
      id: bme_umiditate
      unit_of_measurement: "%"
      accuracy_decimals: 1
    
 
  # --- BH1750 : Luminozitate lux ---------------------------------------------
  - platform: bh1750
    name: " Luminozitate"
    id: bh1750_lux
    address: 0x23     # sau 0x5C daca ADDR=VCC
    update_interval: 10s
    accuracy_decimals: 1
    icon: "mdi:white-balance-sunny"
 
 
  # --- Rain Gauge (pluviometru cu reed switch) --------------------------------
  # D6 = GPIO12 — reed switch inchide circuitul la fiecare basculare
  - platform: pulse_counter
    pin: 
      number:  D6      # GPIO12
      mode:
        input: true
        pullup: true
    count_mode: 
      rising_edge: DISABLE
      falling_edge: INCREMENT
    unit_of_measurement: 'mm'
    icon: mdi:weather-rainy
    accuracy_decimals: 0
    internal_filter: 50ms 
    filters:
      - multiply: 0.20129
    name: 'Rain Gauge mm/min'
    update_interval: 60s
    total:
      unit_of_measurement: 'mm'
      name: 'Rain Gauge Total'
      state_class: total_increasing
      device_class: water
      accuracy_decimals: 3
      filters:
        - multiply: 0.20129

  # - platform: pulse_meter
  #   pin: 
  #     number: D6      # GPIO12
  #     mode: INPUT_PULLUP
  #   unit_of_measurement: 'mm/h'
  #   icon: mdi:weather-rainy
  #   device_class: precipitation_intensity
  #   state_class: measurement
  #   accuracy_decimals: 2
  #   internal_filter: 500ms 
  #   filters:
  #     - multiply: 11.1158
  #   name: 'Rain Gauge mm'
  #   total:
  #     unit_of_measurement: 'L/m²'
  #     name: 'Rain Gauge Total'
  #     state_class: total_increasing
  #     device_class: water
  #     accuracy_decimals: 3
  #     filters:
  #     - multiply: 11.1158
  
 
  # --- Diagnostice -----------------------------------------------------------
  - platform: wifi_signal
    name: " WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
 
  - platform: uptime
    name: " Uptime"
    update_interval: 60s
    entity_category: diagnostic
 
# ─── Senzor text: directie cardinala ─────────────────────────────────────────
text_sensor:
  - platform: template
    name: " Directie Cardinala"
    icon: "mdi:compass"
    lambda: |-
      float deg = id(directie_vant).state;
      if (deg < 0) return {"N/A"};
      while (deg >= 360) deg -= 360;
      while (deg < 0)    deg += 360;
      if (deg < 22.5  || deg >= 337.5) return {"N"};
      if (deg < 67.5)  return {"NE"};
      if (deg < 112.5) return {"E"};
      if (deg < 157.5) return {"SE"};
      if (deg < 202.5) return {"S"};
      if (deg < 247.5) return {"SV"};
      if (deg < 292.5) return {"V"};
      if (deg < 337.5) return {"NV"};
      return {"N"};
    update_interval: 2s
 
  - platform: wifi_info
    ip_address:
      name: " IP"
      entity_category: diagnostic
 
# ─── Buton restart ───────────────────────────────────────────────────────────
button:
  - platform: restart
    name: " Restart"
    entity_category: diagnostic
 
# ─── Status LED D1 Mini ──────────────────────────────────────────────────────
status_led:
  pin:
    number: D4    # GPIO2 - LED albastru built-in D1 Mini
    inverted: true