# Divizor extern (baterie 48V, max. proiectat ~60V) intre borna + a bateriei si A0:
#   R1 = 180k ohm (spre baterie+) , R2 = 10k ohm (spre GND, punct median -> A0)
#   La 60V: tensiune pe A0 (header) ~= 3.16V, sub pragul de 3.2V al D1 mini.
# multiply = (R1+R2)/R2 * 3.2 (raport intern D1 mini A0->ADC) = 19.0 * 3.2 = 60.8
# Calibrare: verifica cu un multimetru la borne si ajusteaza multiply daca e nevoie.
sensor:
  - platform: adc
    pin: A0
    name: "Tensiune baterie"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    update_interval: 5s
    filters:
      - multiply: 60.8
