esphome:
  name: "contor-gaz"

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "b108ebea21a5671e665c0bcf35350437"

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou  
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_2
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou

mqtt:
  broker: homeassistant.local
  username: mqtt_user
  password: !secret mqtt_password
  discovery: True
  discovery_retain: True
  birth_message:
  will_message:

sensor:
  - platform: pulse_counter
    pin:
      number: 13
      inverted: true
      mode:
        input: true
        pullup: true
    unit_of_measurement: 'L'
    accuracy_decimals: 1
    name: 'Contor gas L/min'
    filters:
      - multiply: 10 
    internal_filter: 500ms 
    total:
      unit_of_measurement: 'm³'
      name: 'Contor gas m³'
      state_class: total_increasing
      device_class: gas
      accuracy_decimals: 3
      filters:
        - multiply: 0.01
  

        
