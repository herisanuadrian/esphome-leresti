# Generated by esphome-code-assistant v1.0.0
# https://github.com/tonylofgren/claude.code.skills.esphome

esphome:
  name: bmp280-bucatarie

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou

captive_portal:

one_wire:
  - platform: gpio
    pin: 12

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 100kHz

sensor:

  - platform: dallas_temp
    address: 0x6f0416c15d0aff28
    name: "Temp. Apa Calorifer"
    update_interval: 30s
    resolution: 12

  - platform: bme280_i2c
    temperature:
      name: "Temp. Bucatarie"
      oversampling: 16x
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 22 -> 20
    pressure:
      name: "Pres. Bucatarie"
    address: 0x76
    update_interval: 20s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

binary_sensor:
  # Urmareste starea releu_centrala_gaz de pe alt device ESPHome
  - platform: homeassistant
    id: centrala_gaz_status
    entity_id: switch.releu_centrala_gaz
    on_press:
      - switch.turn_on: pompa_recirculare
    on_release:
      - switch.turn_off: pompa_recirculare

switch:

  # Releu fizic GPIO14
  - platform: gpio
    id: pompa_recirculare
    pin:
      number: 14
      inverted: false
    name: "Pompa Recirculare"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - logger.log: "Pompa Recirculare PORNITA"
    on_turn_off:
      - logger.log: "Pompa Recirculare OPRITA"

output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: rtttl_out

rtttl:
  output: rtttl_out
  on_finished_playback:
    - logger.log: 'Song ended!'