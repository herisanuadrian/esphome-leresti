# Fotorezistor intre 3.3V si A0 (divizor de tensiune, fara rezistenta fixa la GND
# mentionata de utilizator - verifica daca circuitul are un al doilea rezistor spre GND;
# fara el, A0 nu va varia corect intre extreme).
sensor:
  - platform: adc
    pin: A0
    name: "Fotorezistor"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 5s
