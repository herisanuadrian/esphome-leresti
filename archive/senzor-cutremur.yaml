esphome:
  name: senzor-cutremur
 
esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
            
ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"


wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou  
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou


sensor:
  - platform: adc
    filters:
    - calibrate_linear:
      - -6.59 -> 0.0
      - 1.2 -> 100.0

    pin: A0
    name: "Amplitudine"
    update_interval: 10s
binary_sensor:
  
  - platform: gpio
    id: "vibratii_n_s"
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: false
    name: "Vibratii N-S"
    on_press:
      then:
        - rtttl.play: "two short:d=4,o=5,b=100:16e6,16e6"


output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: rtttl_out

rtttl:
  output: rtttl_out
  on_finished_playback:
    - logger.log: 'Song ended!'



    