esphome:
  name: bme280-bucatarie

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
 

captive_portal:

one_wire:
  - platform: gpio
    pin: 12

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 200kHz

sensor:

  - platform: dallas_temp
    address: 0x6f0416c15d0aff28
    name: "Temp. Apa Calorifer"
    update_interval: 30s
    resolution: 12

  - platform: bmp280_i2c
    temperature:
      name: "Temp. Bucatarie"
      oversampling: 16x
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 22 -> 20
    pressure:
      name: "Pres. Bucatarie"
    address: 0x76
    update_interval: 5min

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

switch:

  # Releu fizic GPIO14
  - platform: gpio
    id: pompa_recirculare
    pin:
      number: 14
      inverted: false
    name: "Pompa Recirculare"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - logger.log: "Pompa Recirculare PORNITA"
    on_turn_off:
      - logger.log: "Pompa Recirculare OPRITA"

  # Switch virtual pornire — heater pentru Termostat Hol on
  - platform: template
    id: pompa_1_on
    name: "Pompa 1 On"
    lambda: |-
      return id(pompa_recirculare).state;
    turn_on_action:
      - switch.turn_on: pompa_recirculare
      - logger.log: "pompa_1_on -> PORNIT"
    turn_off_action:
      - logger.log: "pompa_1_on -> OPRIT de termostat"

  # Switch virtual oprire — heater pentru Termostat Hol off
  - platform: template
    id: pompa_1_off
    name: "Pompa 1 Off"
    lambda: |-
      return !id(pompa_recirculare).state;
    turn_on_action:
      - switch.turn_off: pompa_recirculare
      - logger.log: "pompa_1_off -> OPRIT"
    turn_off_action:
      - logger.log: "pompa_1_off -> resetat de termostat"

output:
  - platform: esp8266_pwm
    pin: GPIO13
    id: rtttl_out

rtttl:
  output: rtttl_out
  on_finished_playback:
    - logger.log: 'Song ended!'