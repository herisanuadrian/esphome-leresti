# Generated by esphome-code-assistant v1.0.0
# https://github.com/tonylofgren/claude.code.skills.esphome

substitutions:
  # ─── Pini SPI ─────────────────────────────────────────────────
  pin_spi_clk:  GPIO7
  pin_spi_mosi: GPIO11
  pin_spi_miso: GPIO9
  # ─── Pini Display ─────────────────────────────────────────────
  pin_display_cs:  GPIO12
  pin_display_dc:  GPIO16
  pin_display_rst: GPIO18
  # ─── Backlight ────────────────────────────────────────────────
  pin_backlight: GPIO33

esphome:
  name: monitor-tft-spi
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: main_page

esp32:
  board: esp32-s2-saola-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_CDC

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou

# ─── SPI ──────────────────────────────────────────────────────────
# CLK=${pin_spi_clk}  MOSI=${pin_spi_mosi}  MISO=${pin_spi_miso}
spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}

# ─── Senzor WiFi ──────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Monitor"
    id: sensor_wifi
    update_interval: 30s

# ─── Ora si date din Home Assistant ──────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ─── Backlight ────────────────────────────────────────────────────
# BL -> ${pin_backlight} cu PWM
output:
  - platform: ledc
    pin: ${pin_backlight}
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# ─── Culori ───────────────────────────────────────────────────────
color:
  - id: col_bg
    hex: "0d1b2a"
  - id: col_header
    hex: "1b2838"
  - id: col_accent
    hex: "00b4d8"
  - id: col_white
    hex: "ffffff"
  - id: col_gray
    hex: "8d99ae"
  - id: col_green
    hex: "06d6a0"
  - id: col_yellow
    hex: "ffd166"

# ─── Fonturi ──────────────────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 16
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Roboto"
    id: font_clock
    size: 72

# ─── Display ILI9341 ──────────────────────────────────────────────
# CS=${pin_display_cs}  DC=${pin_display_dc}  RST=${pin_display_rst}
display:
  - platform: ili9xxx
    model: ILI9341
    cs_pin: ${pin_display_cs}
    dc_pin: ${pin_display_dc}
    reset_pin: ${pin_display_rst}
    rotation: 90        # Landscape 320x240
    id: my_display
    auto_clear_enabled: false

# ─── LVGL UI ──────────────────────────────────────────────────────
lvgl:
  displays:
    - my_display
  buffer_size: 25%      # ESP32-S2 are 320KB RAM, fara probleme

  pages:
    - id: main_page
      bg_color: col_bg
      widgets:

        # ── Header ──────────────────────────────────────────────
        - obj:
            x: 0
            y: 0
            width: 320
            height: 48
            bg_color: col_header
            border_width: 0
            radius: 0
            widgets:
              - label:
                  x: 16
                  y: 12
                  text: "Monitor ESPHome"
                  text_color: col_accent
                  text_font: font_medium

              - label:
                  id: lbl_wifi
                  x: 220
                  y: 14
                  text: "-- dBm"
                  text_color: col_gray
                  text_font: font_small

        # ── Ceas mare ───────────────────────────────────────────
        - obj:
            x: 10
            y: 58
            width: 300
            height: 110
            bg_color: col_header
            border_color: col_accent
            border_width: 2
            radius: 12
            widgets:
              - label:
                  id: lbl_time
                  x: 30
                  y: 16
                  text: "--:--"
                  text_color: col_white
                  text_font: font_clock

              - label:
                  id: lbl_seconds
                  x: 248
                  y: 68
                  text: ":--"
                  text_color: col_gray
                  text_font: font_medium

        # ── Data ────────────────────────────────────────────────
        - obj:
            x: 10
            y: 178
            width: 300
            height: 48
            bg_color: col_header
            border_color: col_gray
            border_width: 1
            radius: 12
            widgets:
              - label:
                  id: lbl_date
                  x: 16
                  y: 12
                  text: "-- ------- ----"
                  text_color: col_yellow
                  text_font: font_medium

        # ── Footer ──────────────────────────────────────────────
        - obj:
            x: 0
            y: 228
            width: 320
            height: 12
            bg_color: col_header
            border_width: 0
            radius: 0
            widgets:
              - label:
                  x: 80
                  y: 0
                  text: "ESPHome • Home Assistant"
                  text_color: col_gray
                  text_font: font_small

# ─── Actualizare UI ───────────────────────────────────────────────
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            return id(ha_time).now().strftime("%H:%M");

      - lvgl.label.update:
          id: lbl_seconds
          text: !lambda |-
            return id(ha_time).now().strftime(":%S");

      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            return id(ha_time).now().strftime("%A, %d %B %Y");

  - interval: 30s
    then:
      - lvgl.label.update:
          id: lbl_wifi
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f dBm", id(sensor_wifi).state);
            return std::string(buf);