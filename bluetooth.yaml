# Generated by esphome-code-assistant v1.0.0
# https://github.com/tonylofgren/claude.code.skills.esphome
#
# ESP32 + JDY-3x (JDY-31 / JDY-33) - modul Bluetooth Classic SPP
# Modulul e "slave-only": alt dispozitiv (telefon/PC) trebuie sa initieze
# imperecherea si conexiunea. PIN implicit de imperechere: 1234

substitutions:
  node_name: "jdy3x-bridge"
  friendly_name: "JDY-3x Bridge"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  networks:
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
  manual_ip:
    static_ip: 192.168.0.176
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  ap:
    ssid: "${node_name} Fallback"

captive_portal:

# Home Assistant native API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    # Apelabil din HA: Developer Tools > Actions > ESPHome: send_to_jdy3x
    - service: send_to_jdy3x
      variables:
        payload: string
      then:
        - uart.write:
            id: jdy_uart
            data: !lambda |-
              std::string msg = payload + "\r\n";
              return std::vector<uint8_t>(msg.begin(), msg.end());

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

logger:
  # pune DEBUG ca sa vezi traficul UART brut in log daca ceva nu merge
  level: INFO

# --- UART catre modulul JDY-3x ---
uart:
  id: jdy_uart
  tx_pin: GPIO17   # -> RXD pe JDY-3x
  rx_pin: GPIO16   # <- TXD pe JDY-3x
  baud_rate: 9600  # implicit din fabrica; verifica/schimba cu AT+BAUD daca l-ai modificat

# --- Date primite prin Bluetooth (retransmise de modul pe UART) ---
text_sensor:
  - platform: template
    name: "${friendly_name} Date primite"
    id: jdy_data
    icon: "mdi:bluetooth-transfer"

binary_sensor:
  # pinul STATE al JDY-3x: HIGH cand e conectat, LOW cand nu e
  - platform: gpio
    pin: GPIO19
    name: "${friendly_name} Conectat"
    device_class: connectivity

button:
  # buton de test: trimite comanda AT catre modul (raspunsul apare in "Date primite")
  - platform: template
    name: "${friendly_name} Test AT"
    icon: "mdi:message-question"
    on_press:
      - uart.write:
          id: jdy_uart
          data: "AT\r\n"

# citire non-blocanta a bufferului UART, linie cu linie
# JDY-3x termina mesajele cu \r\n
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static std::string line;
          uint8_t byte;
          while (id(jdy_uart).available()) {
            id(jdy_uart).read_byte(&byte);
            if (byte == '\n') {
              if (!line.empty()) {
                id(jdy_data).publish_state(line);
                line.clear();
              }
            } else if (byte != '\r') {
              line += (char) byte;
            }
          }