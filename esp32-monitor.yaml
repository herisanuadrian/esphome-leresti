# Generated by esphome-code-assistant v1.0.0
# https://github.com/tonylofgren/claude.code.skills.esphome

substitutions:
  # ─── Pini SPI ─────────────────────────────────────────────────
  pin_spi_clk:  "14"
  pin_spi_mosi: "13"
  pin_spi_miso: "12"
  # ─── Pini Display ─────────────────────────────────────────────
  pin_display_cs:  "15"
  pin_display_dc:  "2"
  pin_display_rst: "4"
  # ─── Pini Touch XPT2046 ───────────────────────────────────────
  pin_touch_cs:  "21"
  pin_touch_irq: "22"
  # ─── Buzzer pasiv ─────────────────────────────────────────────
  pin_buzzer: "32"
  # ─── Backlight ────────────────────────────────────────────────
  pin_backlight: "33"
  # ─── Display ──────────────────────────────────────────────────
  display_invert_colors: "false"

esphome:
  name: esp32-monitor
  friendly_name: esp32-monitor
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: page_clock

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_IGNORE_NOTFOUND: y

packages:
  logging/logger: !include esp32-monitor/packages/logging/logger.yaml
  network/wifi: !include esp32-monitor/packages/network/wifi.yaml
  network/api: !include esp32-monitor/packages/network/api.yaml
  network/ota: !include esp32-monitor/packages/network/ota.yaml
  hardware/spi: !include esp32-monitor/packages/hardware/spi.yaml
  hardware/touchscreen: !include esp32-monitor/packages/hardware/touchscreen.yaml
  time/time: !include esp32-monitor/packages/time/time.yaml
  sensors/sensor: !include esp32-monitor/packages/sensors/sensor.yaml
  actuators/output: !include esp32-monitor/packages/actuators/output.yaml
  actuators/light: !include esp32-monitor/packages/actuators/light.yaml
  actuators/rtttl: !include esp32-monitor/packages/actuators/rtttl.yaml
  ui/display: !include esp32-monitor/packages/ui/display.yaml
  ui/lvgl_base: !include esp32-monitor/packages/ui/lvgl_base.yaml
  ui/lvgl_page_clock: !include esp32-monitor/packages/ui/lvgl_page_clock.yaml
  ui/lvgl_page_exterior: !include esp32-monitor/packages/ui/lvgl_page_exterior.yaml
  ui/lvgl_page_dormitor: !include esp32-monitor/packages/ui/lvgl_page_dormitor.yaml
  automations/script: !include esp32-monitor/packages/automations/script.yaml
  automations/interval: !include esp32-monitor/packages/automations/interval.yaml
