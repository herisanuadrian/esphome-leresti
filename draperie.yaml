esphome:
  name: draperie

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "b108ebea21a5671e665c0bcf35350437"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou

captive_portal:


time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 8
        then:
          - script.execute: open_draperie
      - seconds: 0
        minutes: 30
        hours: 20
        then:
          - script.execute: close_draperie


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      inverted: False
    name: "Button"
    id: button_input


globals:
  - id: draperie_is_closed
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: draperie_is_open
    type: bool
    restore_value: true
    initial_value: 'false'


script:
  - id: open_draperie
    mode: single
    then:
      - switch.turn_off: draperie_close
      - switch.turn_on: draperie_open
      - delay: 30s
      - switch.turn_off: draperie_open
      - globals.set:
          id: draperie_is_open
          value: 'true'
      - globals.set:
          id: draperie_is_closed
          value: 'false'

  - id: close_draperie
    mode: single
    then:
      - switch.turn_off: draperie_open
      - switch.turn_on: draperie_close
      - delay: 30s
      - switch.turn_off: draperie_close
      - globals.set:
          id: draperie_is_closed
          value: 'true'
      - globals.set:
          id: draperie_is_open
          value: 'false'


sensor:
  - platform: wifi_signal
    name: "Draperie WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic


switch:
  - platform: gpio
    id: draperie_open
    pin: 12
    inverted: true
    name: "Draperie Open"
  - platform: gpio
    id: draperie_close
    pin: 13
    inverted: true
    name: "Draperie Close"