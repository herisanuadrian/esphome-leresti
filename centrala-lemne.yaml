
esphome:
  name: "centrala-lemne"

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  min_auth_mode: WPA2
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_2
      password: !secret wifi_password_nou
  ap:
    ssid: "Centrala-Lemne Fallback"
    password: "fallback1234"

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    address: 0xa90316b5bda9ff28
    id: temperatura_boiler
    name: "Temp. Boiler"
    filters:
      - filter_out: nan
      - clamp:
          min_value: -10
          max_value: 120

  - platform: dallas_temp
    address: 0xab0516b4ecdaff28
    id: temperatura_panou
    name: "Temp. Panou Solar"

  - platform: dallas_temp
    address: 0x7d0316b5c00cff28
    id: temperatura_acm_boiler
    name: "Temp. ACM Boiler"

  - platform: dallas_temp
    address: 0x430516b4ea7fff28
    id: temperatura_centrala_lemne
    name: "Temp. Centrala Lemne"

  - platform: dallas_temp
    address: 0x45000000822bef28
    id: temperatura_boiler_sus
    name: "Temp. Boiler Sus"

  - platform: homeassistant
    id: ha_tensiune_baterie
    entity_id: sensor.tensiune_baterie_tensiune_baterie
    on_value:
      - lambda: |-
          id(ultima_tensiune_ms) = millis();

  - platform: homeassistant
    id: ha_luminozitate
    entity_id: sensor.statie_meteo_luminozitate

  - platform: homeassistant
    id: ha_productie_solara
    entity_id: sensor.gradina_fotorezistor_productie_solara
    on_value:
      - lambda: |-
          id(ultima_productie_solara_ms) = millis();

  - platform: homeassistant
    id: ha_putere_inverter
    entity_id: sensor.gradina_consum_inverter_putere

number:
  - platform: template
    id: prag_tensiune_baterie
    name: "Prag Tensiune Baterie"
    icon: "mdi:battery-charging-60"
    min_value: 40
    max_value: 60
    step: 0.5
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 55

  - platform: template
    id: prag_luminozitate
    name: "Prag Luminozitate"
    icon: "mdi:brightness-6"
    min_value: 0
    max_value: 5500
    step: 100
    unit_of_measurement: "lx"
    optimistic: true
    restore_value: true
    initial_value: 4000

  - platform: template
    id: prag_productie_solara
    name: "Prag Productie Solara"
    icon: "mdi:solar-power"
    min_value: 0.1
    max_value: 1
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 0.5

  - platform: template
    id: prag_contor_tensiune_s
    name: "Prag Contor Tensiune"
    icon: "mdi:timer-outline"
    min_value: 60
    max_value: 300
    step: 10
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 300

  - platform: template
    id: prag_oprire_putere_inverter
    name: "Prag Oprire Putere Inverter"
    icon: "mdi:flash-alert"
    min_value: 0
    max_value: 3000
    step: 100
    unit_of_measurement: "W"
    optimistic: true
    restore_value: true
    initial_value: 2500

binary_sensor:
  - platform: gpio
    id: input_pompa_panou
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: false
    name: "Functionare Pompa Panou"

  - platform: template
    id: cond_tensiune_ok
    name: "Cond. Pornire: Tensiune Baterie"
    device_class: problem

  - platform: template
    id: cond_luminozitate_ok
    name: "Cond. Pornire: Luminozitate"
    device_class: problem

  - platform: template
    id: cond_productie_solara_ok
    name: "Cond. Pornire: Productie Solara"
    device_class: problem

  - platform: template
    id: cond_putere_ok
    name: "Cond. Pornire: Putere Inverter"
    device_class: problem

  - platform: template
    id: cond_boiler_oprit
    name: "Cond. Pornire: Boiler Oprit"
    device_class: problem

  - platform: template
    id: cond_comutator_general
    name: "Cond. Pornire: Comutator General"
    device_class: problem

switch:
  - platform: gpio
    id: releu_acm
    pin:
      number: GPIO5
      inverted: False
    name: "Releu ACM"
    restore_mode: ALWAYS_OFF


  - platform: gpio
    id: releu_static
    pin:
      number: GPIO15
      inverted: false
    name: "Releu Static"

  - platform: template
    id: comutator_general_boiler
    name: "Comutator general boiler"
    icon: "mdi:water-boiler"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - lambda: |-
          if (id(boilerul_este_pornit)) {
            id(opreste_boiler).execute();
          }

globals:
  - id: boilerul_este_pornit
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: contor_tensiune_s
    type: int
    restore_value: false
    initial_value: '0'
  - id: contor_luminozitate_s
    type: int
    restore_value: false
    initial_value: '0'
  - id: contor_productie_solara_s
    type: int
    restore_value: false
    initial_value: '0'
  - id: ultima_tensiune_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ultima_productie_solara_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  - id: porneste_boiler
    mode: single
    then:
      - globals.set:
          id: boilerul_este_pornit
          value: 'true'
      - switch.turn_on: releu_static

  - id: opreste_boiler
    mode: single
    then:
      - globals.set:
          id: boilerul_este_pornit
          value: 'false'
      - switch.turn_off: releu_static

interval:
  - interval: 30s
    then:
      - lambda: |-
          float temp = id(temperatura_boiler_sus).state;
          ESP_LOGD("ACM", "Temp Boiler=%.1f, Releu ACM=%d", temp, id(releu_acm).state);
          if (isnan(temp) || temp > 120.0 || temp < -10.0) {
            ESP_LOGD("ACM", "Temperatura invalida -> Releu OFF");
            id(releu_acm).turn_off();
            return;
          }
          if (temp >= 48.0) {
            ESP_LOGD("ACM", "Temp >= 48 -> Releu ON");
            id(releu_acm).turn_on();
          } else if (temp <= 35.0) {
            ESP_LOGD("ACM", "Temp <= 35 -> Releu OFF");
            id(releu_acm).turn_off();
          }

  - interval: 5s
    then:
      - lambda: |-
          const int pas_s = 5;
          const float consum_boiler_w = 1900.0;
          float prag_oprire_putere_w = id(prag_oprire_putere_inverter).state;
          float prag_pornire_putere_w = prag_oprire_putere_w - 100.0;
          float tensiune = id(ha_tensiune_baterie).state;
          float luminozitate = id(ha_luminozitate).state;
          float productie_solara = id(ha_productie_solara).state;
          float putere_inverter_w = id(ha_putere_inverter).state;
          float prag_tensiune = id(prag_tensiune_baterie).state;
          float prag_lum = id(prag_luminozitate).state;
          float prag_prod = id(prag_productie_solara).state;

          bool tensiune_recenta = (millis() - id(ultima_tensiune_ms)) < 60000;
          bool tensiune_ok = !isnan(tensiune) && tensiune >= prag_tensiune && tensiune_recenta;
          bool luminozitate_ok = !isnan(luminozitate) && luminozitate >= prag_lum;
          bool productie_solara_recenta = (millis() - id(ultima_productie_solara_ms)) < 60000;
          bool productie_solara_ok = !isnan(productie_solara) && productie_solara >= prag_prod; // && productie_solara_recenta; // dezactivat: valoare plafonata la 1V -> HA nu mai trimite update-uri
          bool putere_valida = !isnan(putere_inverter_w);

          ESP_LOGD("RELEU_STATIC", "tensiune=%.2f prag_tensiune=%.2f tensiune_recenta=%d tensiune_ok=%d luminozitate=%.2f prag_lum=%.2f luminozitate_ok=%d productie_solara=%.2f prag_prod=%.2f productie_solara_recenta=%d productie_solara_ok=%d putere_inverter_w=%.1f putere_valida=%d contor_tensiune_s=%d contor_luminozitate_s=%d contor_productie_solara_s=%d boilerul_este_pornit=%d",
                   tensiune, prag_tensiune, tensiune_recenta, tensiune_ok, luminozitate, prag_lum, luminozitate_ok,
                   productie_solara, prag_prod, productie_solara_recenta, productie_solara_ok,
                   putere_inverter_w, putere_valida,
                   id(contor_tensiune_s), id(contor_luminozitate_s), id(contor_productie_solara_s), id(boilerul_este_pornit));

          if (tensiune_ok) {
            id(contor_tensiune_s) += pas_s;
          } else {
            id(contor_tensiune_s) = 0;
          }

          if (luminozitate_ok) {
            id(contor_luminozitate_s) += pas_s;
          } else {
            id(contor_luminozitate_s) = 0;
          }

          if (productie_solara_ok) {
            id(contor_productie_solara_s) += pas_s;
          } else {
            id(contor_productie_solara_s) = 0;
          }

          if ((!tensiune_ok || !luminozitate_ok || !productie_solara_ok) && id(boilerul_este_pornit)) {
            id(opreste_boiler).execute();
            return;
          }

          if (putere_valida && putere_inverter_w > prag_oprire_putere_w && id(boilerul_este_pornit)) {
            ESP_LOGD("RELEU_STATIC", "Consum inverter %.1fW > prag oprire %.1fW -> opresc boiler", putere_inverter_w, prag_oprire_putere_w);
            id(opreste_boiler).execute();
            return;
          }

          bool ok_tensiune = id(contor_tensiune_s) >= id(prag_contor_tensiune_s).state;
          bool ok_luminozitate = id(contor_luminozitate_s) >= 10;
          bool ok_productie = id(contor_productie_solara_s) >= 10;
          bool ok_putere = !putere_valida || (putere_inverter_w + consum_boiler_w) <= prag_pornire_putere_w;
          bool ok_boiler_oprit = !id(boilerul_este_pornit);
          bool ok_comutator = id(comutator_general_boiler).state;

          id(cond_tensiune_ok).publish_state(ok_tensiune);
          id(cond_luminozitate_ok).publish_state(ok_luminozitate);
          id(cond_productie_solara_ok).publish_state(ok_productie);
          id(cond_putere_ok).publish_state(ok_putere);
          id(cond_boiler_oprit).publish_state(ok_boiler_oprit);
          id(cond_comutator_general).publish_state(ok_comutator);

          if (ok_tensiune && ok_luminozitate && ok_productie && ok_putere && ok_boiler_oprit && ok_comutator) {
            id(porneste_boiler).execute();
          }