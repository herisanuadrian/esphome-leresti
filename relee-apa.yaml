      - delay: 30min
      - switch.turn_off: relay_rand_1

  - platform: gpio
    pin: 14
    name: "Relay randul 2"
    id: relay_rand_2
    on_turn_on:
      - delay: 30min
      - switch.turn_off: relay_rand_2

  - platform: gpio
    pin: 12
    name: "Relay randul 3"
    id: relay_rand_3
    on_turn_on:
      - delay: 30min
      - switch.turn_off: relay_rand_3

  - platform: gpio
    pin: 13
    name: "Relay randul 4"
    id: relay_rand_4
    on_turn_on:
      - delay: 20min
      - switch.turn_off: relay_rand_4

sensor:
