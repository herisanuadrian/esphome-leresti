# DEPENDS ON: (nothing)
# EXPOSES: i2s_audio.i2s_mic (consumed by audio/microphone.yaml), i2s_audio.i2s_spk (consumed by audio/speaker.yaml)

# Two independent I2S buses — this board wires the INMP441 mic and MAX98357A
# amp to separate I2S peripherals (unlike the previous ES8311 board, which
# shared one bus between mic and speaker).
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4   # INMP441 WS
    i2s_bclk_pin: GPIO5    # INMP441 SCK
  - id: i2s_spk
    i2s_lrclk_pin: GPIO16  # MAX98357A LRC
    i2s_bclk_pin: GPIO15   # MAX98357A BCLK
