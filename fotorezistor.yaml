# Celula solara 53x30mm intre A0 (pozitiv) si GND (negativ), cu rezistor de
# sarcina 69 ohm in paralel pe celula. A0 citeste tensiunea peste rezistor.
sensor:
  - platform: adc
    pin: A0
    id: productie_solara
    name: "Productie solara"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  - platform: template
    name: "Iradiere solara"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      float v = id(productie_solara).state;
      // Calibrare pe punct real: la 0.78V, productia solara reala este 2770W.
      // Model P ~ V^2 (relatie patratica, R se anuleaza in constanta calibrata).
      const float v_cal = 0.78;
      const float p_cal = 2770.0;
      return (v * v) * (p_cal / (v_cal * v_cal));
