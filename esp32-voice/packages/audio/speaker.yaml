# DEPENDS ON: hardware/i2s_bus.yaml (i2s_bus_audio), hardware/codec.yaml (es8311_dac), ${pin_i2s_dout} (substitution)
# EXPOSES: speaker.spk_es8311 (id, consumed by voice/assistant.yaml)

# sample_rate matches hardware/codec.yaml's es8311_dac sample_rate.
speaker:
  - platform: i2s_audio
    id: spk_es8311
    i2s_audio_id: i2s_bus_audio
    dac_type: external
    i2s_dout_pin: ${pin_i2s_dout}
    sample_rate: 16000
    i2s_mode: primary
    audio_dac: es8311_dac
    buffer_duration: 500ms
    timeout: 500ms
