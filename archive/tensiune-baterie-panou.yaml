esphome:
  name: tensiune-baterie-panou

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou  
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3  
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_2
      password: !secret wifi_password_nou

sensor:
  - platform: pulse_counter
    pin:
      number: 14
      mode: INPUT_PULLUP
    name: "Viteza vant"
    unit_of_measurement: "km/h"
    icon: "mdi:wather-windy"
    accuracy_decimals: 1
    update_interval: 10s

  - platform: rotary_encoder
    name: "Rotary Encoder"
    pin_a: 
      number: D1
      inverted: true
      mode:
       input: true
       pullup: true
    pin_b: 
      number: D2
      inverted: true
      mode:
        input: true
        pullup: true
    on_clockwise:
      - logger.log: "Turned Clockwise"
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"