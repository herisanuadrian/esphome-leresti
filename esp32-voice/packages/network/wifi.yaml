# DEPENDS ON: wifi_ssid_ext, wifi_password, wifi_ssid_nou, wifi_password_nou, wifi_ssid_ext_nou (secrets)
# EXPOSES: (nothing — platform configuration)

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
