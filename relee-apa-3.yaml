esphome:
  name: relee-apa-3
  

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou  
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3  
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_2
      password: !secret wifi_password_nou

one_wire:
  - platform: gpio
    pin: GPIO14

i2c:
  id: bus_a
  sda: D2
  scl: D1
  scan: true

ads1115:
  i2c_id: bus_a
  address: 0x48
  continuous_mode: on
  id: ads1115_48
   

sensor:
  #ads1115-48
  - name: "Randul 31 zmeura"
    id: ads1115_a1
    ads1115_id: ads1115_48
    multiplexer: 'A1_GND'
    gain: 6.144
    platform: ads1115
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 5.15-> 0.0
        - 0.00-> 100.0
  - name: "Randul 32 rosii"
    id: ads1115_a2
    ads1115_id: ads1115_48
    multiplexer: 'A3_GND'
    gain: 6.144
    platform: ads1115
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 5.15-> 0.0
        - 0.00-> 100.0
   


 
  - platform: dallas_temp
    address: 0x8905170057c0ff28
    name: "Temperatura Ext, 3"
    update_interval: 180s
    id: temperatura_ext_3
  

  - platform: adc
    pin: A0
    name: "Tensiune baterie 3"
    update_interval: 180s
    filters:
      - multiply: 13.85




switch:
  - platform: gpio
    pin: 12
    name: "Releu 31"
    inverted: true
    id: releu_31
    on_turn_on:
      - delay: 20min
      - switch.turn_off: releu_31
    

  - platform: gpio
    pin: 13
    name: "Releu 32"
    inverted: true
    id: releu_32
    on_turn_on:
      - delay: 35min
      - switch.turn_off: releu_32