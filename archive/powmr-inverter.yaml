uart:
  id: uart_modbus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600   # will be changed at runtime by the script
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 256
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 500ms
    sequence:
      - lambda: |-
          std::string hex;
          for (auto b : bytes) {
            char buf[4];
            snprintf(buf, sizeof(buf), "%02X ", b);
            hex += buf;
          }
          if (direction == uart::UART_DIRECTION_TX) {
            ESP_LOGI("probe", "TX >>> %s", hex.c_str());
          } else {
            ESP_LOGI("probe", "RX <<< %s", hex.c_str());
          }

# Modbus RTU read request: slave=5, func=03, addr=0x1195, count=1
# CRC pre-calculated for this frame at all baud rates (CRC is data-dependent, not baud-dependent)
# Frame: 05 03 11 95 00 01 D4 A3
globals:
  - id: current_baud
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: baud_probe
    then:
      - lambda: |-
          // Try 2400 baud first (most likely for this inverter)
          int bauds[] = {2400, 4800, 9600};
          int num_bauds = 5;
          
          for (int i = 0; i < num_bauds; i++) {
            ESP_LOGI("probe", "=============================");
            ESP_LOGI("probe", "Trying baud rate: %d", bauds[i]);
            ESP_LOGI("probe", "=============================");
            
            // Reconfigure UART
            uart_config_t uart_config = {
              .baud_rate = bauds[i],
              .data_bits = UART_DATA_8_BITS,
              .parity = UART_PARITY_EVEN,
              .stop_bits = UART_STOP_BITS_1,
              .flow_ctrl = UART_HW_FLOWCTRL_DISABLE,
            };
            uart_param_config(UART_NUM_1, &uart_config);
            
            // Wait for line to settle
            delay(200);
            
            // Flush RX buffer
            uart_flush(UART_NUM_1);
            
            // Send Modbus RTU: slave 5, FC03, reg 0x1195, count 1
            // CRC for {05 03 11 95 00 01} = 0xA3D4 → bytes D4 A3
            uint8_t frame[] = {0x05, 0x03, 0x11, 0x95, 0x00, 0x01, 0xD4, 0xA3};
            uart_write_bytes(UART_NUM_1, (const char*)frame, sizeof(frame));
            
            // Wait for response (generous timeout at slow baud rates)
            delay(1000);
            
            // Check if anything came back
            size_t available;
            uart_get_buffered_data_len(UART_NUM_1, &available);
            if (available > 0) {
              ESP_LOGI("probe", ">>> GOT RESPONSE at %d baud! %d bytes waiting", bauds[i], available);
            } else {
              ESP_LOGI("probe", "No response at %d baud", bauds[i]);
            }
            
            delay(500);
          }
          ESP_LOGI("probe", "Probe complete - check above for GOT RESPONSE");

binary_sensor:
