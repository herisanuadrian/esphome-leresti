esphome:
  name: umiditate-sol-zmeura

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="

ota:
  - platform: esphome
    password: "b108ebea21a5671e665c0bcf35350437"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou 
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_3
      password: !secret wifi_password_nou


deep_sleep:
  id: deep_sleep_umiditate_sol_zmeura
  run_duration: 20s
  sleep_duration: 40min  

  
i2c:
  id: bus_a
  sda: D2
  scl: D1
  scan: true

ads1115:
  i2c_id: bus_a
  address: 0x48
  continuous_mode: on
  id: ads1115_48
   

sensor:
  #ads1115-48
  - name: "Randul 1"
    id: ads1115_a0
    ads1115_id: ads1115_48
    multiplexer: 'A0_GND'
    gain: 2.048
    platform: ads1115
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 2.048-> 0.0
        - 0.59-> 95.0
  - name: "Randul 2"
    id: ads1115_a1
    ads1115_id: ads1115_48
    multiplexer: 'A1_GND'
    gain: 2.048
    platform: ads1115
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 2.048-> 0.0
        - 0.56-> 95.0
  - name: "Randul 3"
    id: ads1115_a2
    ads1115_id: ads1115_48
    multiplexer: 'A2_GND'
    gain: 2.048
    platform: ads1115
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 2.048-> 0.0
        - 0.59-> 95.0
  - name: "Randul 4"
    id: ads1115_a3
    ads1115_id: ads1115_48
    multiplexer: 'A3_GND'
    gain: 2.048
    platform: ads1115       
    unit_of_measurement: "%"
    filters:
      calibrate_linear:
        - 2.048-> 0.0
        - 0.59-> 95.0

  - platform: adc
    pin: A0
    name: "Tensiune baterie"
    update_interval: 60s
    filters:
      - multiply: 13.2

