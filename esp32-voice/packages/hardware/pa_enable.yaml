# DEPENDS ON: ${pin_pa_enable} (substitution)
# EXPOSES: (nothing — internal-only, no HA entity)

# Always-on speaker amp enable — no HA control in this scope.
# TODO verify: PA enable polarity; active-high assumed, unconfirmed.
switch:
  - platform: gpio
    id: pa_enable
    name: "PA Enable"
    internal: true
    pin:
      number: ${pin_pa_enable}
      inverted: false
    restore_mode: ALWAYS_ON
