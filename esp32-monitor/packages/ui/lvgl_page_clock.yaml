# DEPENDS ON: color.*, font.* (ui/display.yaml). NOTE: this package's key in esp32-monitor.yaml's packages: block must be listed BEFORE lvgl_page_exterior/lvgl_page_dormitor — the 6s auto-advance interval (automations/interval.yaml) cycles pages in assembled order, not by id. See esp32-monitor/NOTES.md.
# EXPOSES: lvgl page_clock. Widget ids: p1_wifi, p1_time, p1_seconds, p1_date, p1_dorm_temp, p1_dorm_umid, p1_notif_box, p1_notif_text — all written by automations/script.yaml and/or automations/interval.yaml

lvgl:
  pages:

    # ════════════════════════════════════════════════════════════
    # PAGINA 1: CEAS MARE
    # ════════════════════════════════════════════════════════════
    - id: page_clock
      bg_color: col_bg
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 36
            bg_color: col_header
            border_width: 0
            radius: 0
            widgets:
              - label:
                  x: 12
                  y: 10
                  text: "ESP32 Monitor"
                  text_color: col_accent
                  text_font: font_medium
              - label:
                  id: p1_wifi
                  x: 370
                  y: 10
                  text: "-- dBm"
                  text_color: col_gray
                  text_font: font_small

        - obj:
            x: 8
            y: 44
            width: 464
            height: 130
            bg_color: col_header
            border_color: col_accent
            border_width: 2
            radius: 12
            widgets:
              - label:
                  id: p1_time
                  x: 50
                  y: 20
                  text: "--:--"
                  text_color: col_white
                  text_font: font_clock_big
              - label:
                  id: p1_seconds
                  x: 380
                  y: 80
                  text: ":--"
                  text_color: col_gray
                  text_font: font_large

        - obj:
            x: 8
            y: 182
            width: 464
            height: 48
            bg_color: col_header
            border_color: col_yellow
            border_width: 1
            radius: 10
            widgets:
              - label:
                  id: p1_date
                  x: 12
                  y: 12
                  text: "---, -- ------- ----"
                  text_color: col_yellow
                  text_font: font_medium

        - obj:
            x: 8
            y: 238
            width: 228
            height: 44
            bg_color: col_header
            border_color: col_purple
            border_width: 1
            radius: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "DORMITOR 1"
                  text_color: col_gray
                  text_font: font_small
              - label:
                  id: p1_dorm_temp
                  x: 10
                  y: 22
                  text: "--.-°C"
                  text_color: col_purple
                  text_font: font_medium

        - obj:
            x: 244
            y: 238
            width: 228
            height: 44
            bg_color: col_header
            border_color: col_green
            border_width: 1
            radius: 10
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "UMIDITATE"
                  text_color: col_gray
                  text_font: font_small
              - label:
                  id: p1_dorm_umid
                  x: 10
                  y: 22
                  text: "--%"
                  text_color: col_green
                  text_font: font_medium

        # ── Notificare alarma ────────────────────────────────────
        - obj:
            id: p1_notif_box
            x: 60
            y: 130
            width: 360
            height: 60
            bg_color: col_header
            border_color: col_red
            border_width: 2
            radius: 10
            hidden: true
            widgets:
              - label:
                  id: p1_notif_text
                  x: 10
                  y: 15
                  text: ""
                  text_color: col_red
                  text_font: font_medium

        # ── Dots ────────────────────────────────────────────────
        - obj:
            x: 192
            y: 310
            width: 96
            height: 6
            bg_color: col_bg
            border_width: 0
            radius: 0
            widgets:
              - obj:
                  x: 0
                  y: 0
                  width: 24
                  height: 6
                  bg_color: col_dot_active
                  border_width: 0
                  radius: 3
              - obj:
                  x: 36
                  y: 0
                  width: 24
                  height: 6
                  bg_color: col_dot_inactive
                  border_width: 0
                  radius: 3
              - obj:
                  x: 72
                  y: 0
                  width: 24
                  height: 6
                  bg_color: col_dot_inactive
                  border_width: 0
                  radius: 3
