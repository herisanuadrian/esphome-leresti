# DEPENDS ON: audio/microphone.yaml (implicit — voice_assistant's shared mic pipeline), voice/assistant.yaml (voice_assistant.start action)
# EXPOSES: (nothing named — single micro_wake_word instance, no id)

micro_wake_word:
  models:
    - model: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
  on_wake_word_detected:
    - delay: 300ms
    - voice_assistant.start:
