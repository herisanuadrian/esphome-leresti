# DEPENDS ON: audio/microphone.yaml (mic_es8311), audio/speaker.yaml (spk_es8311), voice/wake_word.yaml (mww)
# EXPOSES: (nothing named — HA Assist voice satellite, auto-registered via api: + voice_assistant:)

voice_assistant:
  id: va
  microphone:
    microphone: mic_es8311
    channels: [0]
  speaker: spk_es8311
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0dBFS
  conversation_timeout: 300s
  volume_multiplier: 1.0
  on_client_connected:
    - micro_wake_word.start: { id: mww }
  on_client_disconnected:
    - micro_wake_word.stop: { id: mww }
  on_end:
    - micro_wake_word.start: { id: mww }
  on_error:
    - micro_wake_word.start: { id: mww }
