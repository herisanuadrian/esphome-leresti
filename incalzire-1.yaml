binary_sensor:
  - platform: gpio
    id: buton_pompa_1_on
    pin:
      number: 4
      mode:
        input: true
        pullup: true
    name: "Buton Pompa 1 on"
  - platform: gpio
    id: buton_pompa_1_off
    pin:
      number: 5
      mode:
        input: true
        pullup: true
    name: "Buton Pompa 1 off"
switch:
  - platform: gpio
    pin: 12
    name: "Pompa 1 on"
    inverted: true
    id: Pompa_1_on
    

  - platform: gpio
    pin: 13
    name: "Pompa 1 off"
    inverted: true
    id: Pompa_1_off    