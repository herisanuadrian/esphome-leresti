ads1115:
  i2c_id: bus_a
  address: 0x48
  continuous_mode: on
  id: ads1115_48
   

sensor:
  #ads1115-48
  - name: "Presiune Apa Retea"
    id: ads1115_a0
    ads1115_id: ads1115_48
    multiplexer: 'A0_GND'
    gain: 4.096
    platform: ads1115
    unit_of_measurement: "bar"
    update_interval: 150s
    
  - name: "Presiune Apa Calorifer"
    id: ads1115_a1
    ads1115_id: ads1115_48
    multiplexer: 'A1_GND'
    gain: 4.096
