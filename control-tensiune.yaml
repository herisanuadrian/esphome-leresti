# Enable Home Assistant API
api:
  encryption:
    key: "JHWU+1hVxt7uEIhkg75gBLagiWHBhlraVoBtmTb35MA="

ota:
  - platform: esphome
    password: "e06b0609e65bfb6185d100c6b70e07d0"

wifi:
  networks:
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_d_link
      password: !secret wifi_password_nou
  power_save_mode: none

# Divizor extern (Tensiune 1, max. proiectat 60V) intre + si GPIO0:
#   R1 = 560k ohm (spre +), R2 = 20k ohm (spre GND, punct median -> GPIO0)
#   La 60V: tensiune pe GPIO0 ~= 60 * 20/580 = 2.07V
# multiply = (R1+R2)/R2 = 29
#
# Modul Hall WCS1800 (35A, Aout) -> divizor 10k/10k -> GPIO1:
#   V(GPIO1) = Aout / 2 (tensiune bruta, fara conversie in A - de calibrat separat)
#   Dout (alarma supracurent WCS1800) -> GPIO2
sensor:
  - platform: adc
    pin: GPIO0
    attenuation: 12db
    id: tensiune_1
    name: "Tensiune 1"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      - multiply: 29

  - platform: adc
    pin: GPIO1
    attenuation: 12db
    id: tensiune_hall_gpio1
    name: "Tensiune Hall GPIO1"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    update_interval: 5s

  # Curent din WCS1800: Aout = V(GPIO1)*2 (divizor 10k/10k), offset 2.5V la 0A, sensibilitate 60mV/A
  - platform: template
    id: curent_hall
    name: "Curent"
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float aout = id(tensiune_hall_gpio1).state * 2.0;
      return (aout - 2.5) / 0.060;

  - platform: template
    name: "Putere"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(tensiune_1).state * id(curent_hall).state;

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode:
        input: true
    name: "Dout WCS1800"
