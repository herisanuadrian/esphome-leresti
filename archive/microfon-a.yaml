captive_portal:
    
output:
  - platform: ledc
    pin: GPIO15
    id: rtttl_out

rtttl:
  output: rtttl_out
  id: my_rtttl

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO25  #LRCLK,WS
    i2s_bclk_pin: GPIO33   #BLCK,SCK
  - id: i2s_out
    i2s_lrclk_pin: GPIO14 #LRCLK,WS
    i2s_bclk_pin: GPIO12  #BLCK,SCK

microphone:
  - platform: i2s_audio
    id: mikrofon
    adc_type: external 
    i2s_audio_id: i2s_mic 
    i2s_din_pin: GPIO32   #DIN,SDIN,SD,SDATA
    pdm: false

        
voice_assistant:
  id: va
  microphone: mikrofon
  use_wake_word: true
  on_listening:
      - rtttl.play: 'two_short:d=4,o=5,b=100:16e6,16e6'

media_player:
  - platform: i2s_audio
    id: player
    name: ESP Media Player
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO18 #DIN,SDIN,SD,SDATA
    on_play:
      - logger.log: "playing"
      - switch.turn_off: use_wake_word
    on_pause:
      - logger.log: "paused"
      - switch.turn_on: use_wake_word
    on_idle:
      - logger.log: "idle"
      - switch.turn_on: use_wake_word

switch:
  - platform: template
    name: Use wake word
    id: use_wake_word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: id(va).set_use_wake_word(true);
      - if:
          condition:
            not:
              - voice_assistant.is_running
          then:
            - voice_assistant.start_continuous
    on_turn_off:
      - voice_assistant.stop
      - lambda: id(va).set_use_wake_word(false); 
