# Generated by esphome-code-assistant v1.0.0
# https://github.com/tonylofgren/claude.code.skills.esphome

substitutions:
  # ─── Pini SPI ─────────────────────────────────────────────────
  pin_spi_clk:  "14"
  pin_spi_mosi: "13"
  pin_spi_miso: "12"
  # ─── Pini Display ─────────────────────────────────────────────
  pin_display_cs:  "15"
  pin_display_dc:  "2"
  pin_display_rst: "4"
  # ─── Pini Touch XPT2046 ───────────────────────────────────────
  pin_touch_cs:  "21"
  pin_touch_irq: "22"
  # ─── Buzzer pasiv ─────────────────────────────────────────────
  pin_buzzer: "32"
  # ─── Backlight ────────────────────────────────────────────────
  pin_backlight: "33"
  # ─── Display ──────────────────────────────────────────────────
  display_invert_colors: "false"

esphome:
  name: esp32-monitor
  friendly_name: esp32-monitor
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: page_clock

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32_SPIRAM_SUPPORT: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_IGNORE_NOTFOUND: y

logger:
  level: DEBUG
  logs:
    xpt2046: DEBUG

api:
  encryption:
    key: "khTmptQ7yYhvP5yxwxTQOSNPs/RK4x+twiKqYqwO900="
  services:
    - service: alarma_picaturi
      then:
        - script.execute:
            id: show_notification
            msg: "Alarma Picaturi"
        - rtttl.play: "picaturi:d=8,o=7,b=160:e,p,e,p,e"
    - service: buton_panica
      then:
        - script.execute:
            id: show_notification
            msg: "Buton Panica!"
        - rtttl.play: "panica:d=4,o=7,b=200:c,e,g,c,e,g,c"
    - service: prezenta_curte
      then:
        - script.execute:
            id: show_notification
            msg: "Prezenta Curte"
        - rtttl.play: "curte:d=8,o=7,b=150:c,e,g"
    - service: prezenta_gradina
      then:
        - script.execute:
            id: show_notification
            msg: "Prezenta Gradina"
        - rtttl.play: "gradina:d=8,o=7,b=150:g,e,c"
    - service: usa_acces
      then:
        - script.execute:
            id: show_notification
            msg: "Usa Acces"
        - rtttl.play: "acces:d=16,o=7,b=140:c,e,g"
    - service: usa_acces_2
      then:
        - script.execute:
            id: show_notification
            msg: "Usa Acces 2"
        - rtttl.play: "acces2:d=16,o=7,b=140:g,e,c"
    - service: buzzer_melodie
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

ota:
  - platform: esphome
    password: "c41e4c28c643ea2045016586d9ad3ecc"

wifi:
  networks:
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_nou
      password: !secret wifi_password_nou
    - ssid: !secret wifi_ssid_ext_nou
      password: !secret wifi_password_nou

# ─── SPI ──────────────────────────────────────────────────────────
spi:
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  miso_pin: ${pin_spi_miso}

# ─── Touch XPT2046 ────────────────────────────────────────────────
touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: ${pin_touch_cs}
    interrupt_pin: ${pin_touch_irq}
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 200
      x_max: 3800
      y_min: 200
      y_max: 3800
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "Touch detectat: x=%d, y=%d", touch.x, touch.y);

# ─── Senzori ──────────────────────────────────────────────────────
sensor:
  - platform: template
    name: "PSRAM Size"
    id: sensor_psram
    unit_of_measurement: "KB"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      #ifdef BOARD_HAS_PSRAM
        return esp_spiram_get_size() / 1024.0;
      #else
        return 0.0;
      #endif

  - platform: template
    name: "Free Heap"
    id: sensor_heap
    unit_of_measurement: "KB"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      return esp_get_free_heap_size() / 1024.0;

  - platform: wifi_signal
    name: "WiFi Signal Monitor"
    id: sensor_wifi
    update_interval: 30s
    entity_category: diagnostic

  - platform: homeassistant
    id: ha_statie_temp
    entity_id: sensor.statie_meteo_temperatura
    unit_of_measurement: "°C"

  - platform: homeassistant
    id: ha_statie_lux
    entity_id: sensor.statie_meteo_luminozitate
    unit_of_measurement: "lx"

  - platform: homeassistant
    id: ha_dorm_temp
    entity_id: sensor.temp_dormitor_1
    unit_of_measurement: "°C"

  - platform: homeassistant
    id: ha_dorm_umid
    entity_id: sensor.umid_dormitor_1
    unit_of_measurement: "%"

# ─── Ora din Home Assistant ───────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ─── Output: Backlight + Buzzer ───────────────────────────────────
output:
  - platform: ledc
    pin: ${pin_backlight}
    id: backlight_pwm
  - platform: ledc
    pin: ${pin_buzzer}
    id: buzzer_out

# ─── Backlight ────────────────────────────────────────────────────
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_OFF

# ─── Buzzer pasiv RTTTL ───────────────────────────────────────────
rtttl:
  output: buzzer_out
  on_finished_playback:
    - logger.log: "Buzzer finished"

